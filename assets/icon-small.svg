<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simplified for 16 and 32 px: window plus a solid sidebar, no fine detail. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86cbe6"/>
      <stop offset="1" stop-color="#3a86ad"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>
  <rect x="6" y="8" width="20" height="16" rx="3.5" fill="#ffffff"/>
  <rect x="8" y="10" width="7" height="12" rx="2" fill="#3a86ad"/>
</svg>
